name: Release
# Publishes a GitHub release with a ready-to-run zip whenever VERSION changes on main.
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Skip if this version is already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then echo "exists=1" >> "$GITHUB_OUTPUT"; fi
      - name: Build zip and notes
        if: steps.check.outputs.exists != '1'
        run: |
          V=${{ steps.v.outputs.version }}
          mkdir -p dist/OBF
          cp main.py engine.py icon_data.py VERSION README.md CHANGELOG.md requirements.txt "Run OBF.bat" dist/OBF/
          (cd dist && zip -qr "OBF-$V.zip" OBF)
          {
            echo "**Download:** \`OBF-$V.zip\` below. Extract the whole folder and double-click **Run OBF.bat** (Windows) or run \`python3 main.py\`."
            echo "Already have OBF? Use the **Update** button in the app instead."
            echo
            awk -v v="$V" '/^## /{p = ($2 == v)} p' CHANGELOG.md
          } > dist/notes.md
      - name: Publish release
        if: steps.check.outputs.exists != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.v.outputs.version }}
          gh release create "v$V" "dist/OBF-$V.zip" --title "OBF $V" --notes-file dist/notes.md --target "${{ github.sha }}"
